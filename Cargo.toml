[package]
name = "reqwest-rate-limit"
version = "0.1.2"
edition = "2024"
description = "Rate-limit aware request helpers and optional wrapper ergonomics for reqwest."
license = "Apache-2.0"
repository = "https://github.com/iFrostizz/reqwest-rate-limit"
homepage = "https://github.com/iFrostizz/reqwest-rate-limit"
documentation = "https://docs.rs/reqwest-rate-limit"

[dependencies]
governor = "0.10.4"
reqwest = "0.13.2"
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[features]
multipart = ["reqwest/multipart"]
query = ["reqwest/query"]
form = ["reqwest/form"]
json = ["reqwest/json"]
